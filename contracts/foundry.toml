[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# version pilotee par les pragmas : v2-core est en 0.5.16
optimizer = true
optimizer_runs = 200
# v2-core est figé en 0.5.16 : il ne compile que sous sa propre version.
auto_detect_solc = true

# Le manifeste de déploiement. Sans cette autorisation, `vm.writeJson` échoue —
# et il échoue à la toute fin de `run()`, donc après le déploiement dans
# l'esprit de qui le lance. Trouvé en simulant le déploiement mainnet plutôt
# qu'en le découvrant pendant.
# `out` en lecture : déclarer une permission désactive le défaut permissif, donc
# les `vm.getCode` des tests — qui chargent les artefacts de Uniswap compilés
# sous leur propre version de solc — se sont mis à échouer dès l'ajout de la
# ligne suivante. Trouvé en relançant la suite, pas en le devinant.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "./deployments" },
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "v2-core/=lib/v2-core/contracts/",
    "v3-core/=lib/v3-core/contracts/",
]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[fmt]
line_length = 100
tab_width = 4
